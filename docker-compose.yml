# Local development infra for AstroFlow.
# Postgres is all the API needs by default (ENABLE_WORKERS=false).
# Uncomment the redis service and set ENABLE_WORKERS=true to run the streak worker.
services:
  postgres:
    image: postgres:16
    container_name: astroflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: astroflow
    ports:
      - "5432:5432"
    volumes:
      - astroflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # redis:
  #   image: redis:7
  #   container_name: astroflow-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"

volumes:
  astroflow_pgdata:
