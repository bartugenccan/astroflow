name: Release (mobile)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Hedef platform
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: EAS build profili
        type: choice
        options: [preview, production]
        default: production
      submit:
        description: Build sonrasi magazaya gonder
        type: boolean
        default: false

jobs:
  preflight:
    name: Preflight (zorunlu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit oncesi kontroller
        run: npx --yes ship-kit preflight

  build:
    name: EAS build
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm ci

      - name: Build
        run: eas build --non-interactive --no-wait --platform ${{ inputs.platform }} --profile ${{ inputs.profile }}
        working-directory: apps/mobile

      - name: Submit
        if: ${{ inputs.submit }}
        run: eas submit --non-interactive --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --latest
        working-directory: apps/mobile
